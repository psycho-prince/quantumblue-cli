name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.5'

    - name: Install dependencies
      run: go mod download

    - name: Run go vet
      run: go vet ./...

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest

    - name: Run go test
      run: go test ./...

  schema-sync-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    # Check if prisma schema was modified without internal/model modifications
    - name: Check schema sync
      run: |
        git fetch origin main
        SCHEMA_MODIFIED=$(git diff --name-only origin/main | grep "prisma/schema.prisma" || true)
        MODEL_MODIFIED=$(git diff --name-only origin/main | grep "internal/model/" || true)
        
        if [ ! -z "$SCHEMA_MODIFIED" ] && [ -z "$MODEL_MODIFIED" ]; then
          echo "Error: prisma/schema.prisma was modified but no changes were made to internal/model/"
          exit 1
        fi
